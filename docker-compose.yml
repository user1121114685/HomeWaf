# HomeWaf modification (2026-11-09): independent distribution; see NOTICE and docs/modernization.

services:
  homewaf:
    build: .
    image: homewaf:local
    ports:
      - "127.0.0.1:26666:26666"
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./conf:/app/conf
      - ./data:/app/data
      - ./.homewaf-keys:/app/.homewaf-keys
      - ./logs:/app/logs
      - ./ssl:/app/ssl
    restart: unless-stopped
    # Grant NET_ADMIN explicitly only when using host firewall management.
    # cap_add: [NET_ADMIN]

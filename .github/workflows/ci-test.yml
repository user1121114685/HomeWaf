# HomeWaf modification (2026-11-09): independent distribution; see NOTICE and docs/modernization.

name: HomeWaf build and focused checks
on:
  pull_request:
  push:
    branches: [main, homewaf-modernization]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homewaf-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend and backend locally
        run: node scripts/build.mjs
        env:
          CGO_ENABLED: '1'
      - name: Compile all packages and run focused regressions
        run: node scripts/verify.mjs
      - name: Audit frontend graph
        run: npm audit --prefix web --audit-level=low
      - name: Analyze reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HomeWaf-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/*
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.md
            LICENSES/THIRD_PARTY.txt
            docs/modernization/MIGRATION.md
            docs/modernization/provenance.json

# HomeWaf modification (2026-11-09): independent distribution; see NOTICE.

name: HomeWaf build and focused checks
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homewaf-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Internal build versions require a reachable ancestor release tag.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify release version allocation
        run: node --test .github/scripts/prepare-release.test.mjs
      - name: Build frontend and backend locally
        run: node scripts/build.mjs
      - name: Compile all packages and run focused regressions
        run: node scripts/verify.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HomeWaf-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/*
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.md
            LICENSES/THIRD_PARTY.txt
            LICENSES/ThirdLicense
            LICENSES/ip2region/LICENSE.txt
            cmd/homewaf/exedata/ip2region_v6.source.json
            README.md
      - name: Run frontend behavior regressions
        run: npm test --prefix web
      - name: Install the isolated browser test runtime
        run: node web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Verify the console update and retry flows
        run: node web/scripts/verify-update-browser.mjs
      - name: Verify application credentials and recovery
        run: node web/scripts/verify-secondary-console-browser.mjs --application-only
      - name: Verify real update API and automatic smooth restart using disposable binaries
        shell: bash
        run: bash scripts/check-upgrade.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: HomeWaf-functional-regressions-${{ runner.os }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/update-browser/
            artifacts/console-subpages/browser/
            artifacts/graceful-update*.json

# HomeWaf modification (2026-11-09): independent distribution; see NOTICE and docs/modernization.

name: HomeWaf release packages
on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Run release regressions
        run: node scripts/verify.mjs
      - name: Protect already published releases
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > "$RUNNER_TEMP/homewaf-release-state" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/homewaf-release-state")" = true || { echo 'Refusing to overwrite a public release' >&2; exit 1; }
          fi
      - name: Produce reviewable archives without publishing
        if: github.ref_type != 'tag'
        uses: goreleaser/goreleaser-action@3d82dc1587053cd8272fa3801faaebfc2e8a12ac
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean --parallelism 2
      - name: Build a draft release for the tagged version
        if: github.ref_type == 'tag'
        uses: goreleaser/goreleaser-action@3d82dc1587053cd8272fa3801faaebfc2e8a12ac
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HomeWaf-release-candidate
          compression-level: 0
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*checksums.txt
  smoke:
    if: github.ref_type == 'tag'
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: HomeWaf-release-candidate
          path: dist
      - name: Install candidate and verify startup and update notifications
        run: node scripts/verify-release.mjs dist ${{ github.ref_name }}
      - name: Verify Windows service installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          $number = $version.Substring(1)
          $dir = Join-Path $env:RUNNER_TEMP 'homewaf-service'
          try {
            ./install_homewaf.ps1 -Version $version -Directory $dir -ArchivePath "dist/HomeWaf_Windows_x86_64_$number.zip" -ChecksumsPath "dist/HomeWaf_${number}_checksums.txt"
            $ready = $false
            for ($i=0; $i -lt 90; $i++) {
              try { if ((Invoke-WebRequest -Uri http://127.0.0.1:26666/ -TimeoutSec 2).StatusCode -eq 200) { $ready=$true; break } } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Windows service did not serve the console' }
          } finally {
            if (Test-Path "$dir/HomeWaf64.exe") { & "$dir/HomeWaf64.exe" stop; & "$dir/HomeWaf64.exe" uninstall }
          }
      - name: Verify Unix service installation
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version='${{ github.ref_name }}'
          os=$(uname -s)
          case $(uname -m) in x86_64) arch=x86_64; suffix=64 ;; *) arch=arm64; suffix=Arm64 ;; esac
          dir="$RUNNER_TEMP/homewaf-service"
          binary="HomeWaf${os}${suffix}"
          trap 'if [[ -x "$dir/$binary" ]]; then sudo "$dir/$binary" stop || true; sudo "$dir/$binary" uninstall || true; fi' EXIT
          sudo bash install_homewaf.sh --version "$version" --dir "$dir" --archive "dist/HomeWaf_${os}_${arch}_${version#v}.tar.gz" --checksums "dist/HomeWaf_${version#v}_checksums.txt"
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:26666/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Service did not serve the console' >&2
          exit 1
  container:
    if: github.ref_type == 'tag'
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            asset_arch: x86_64
            binary: HomeWafLinux64
          - os: ubuntu-24.04-arm
            arch: arm64
            asset_arch: arm64
            binary: HomeWafLinuxArm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: HomeWaf-release-candidate
          path: dist
      - name: Build portable Docker image archive
        shell: bash
        run: |
          version='${{ github.ref_name }}'
          arch='${{ matrix.arch }}'
          asset_arch='${{ matrix.asset_arch }}'
          cd dist
          sha256sum --check "HomeWaf_${version#v}_checksums.txt"
          cd ..
          mkdir -p "docker-dist/$arch" docker-release
          tar -xzf "dist/HomeWaf_Linux_${asset_arch}_${version#v}.tar.gz" -C "docker-dist/$arch" '${{ matrix.binary }}'
          mv "docker-dist/$arch/${{ matrix.binary }}" "docker-dist/$arch/homewaf"
          docker build -f Dockerfile.release --build-arg "TARGETARCH=$arch" --build-arg "HOMEWAF_VERSION=$version" -t "homewaf:$version" .
          archive="HomeWaf_Docker_Linux_${asset_arch}_${version#v}.tar.gz"
          docker save "homewaf:$version" | gzip -1 > "docker-release/$archive"
          cd docker-release
          sha256sum "$archive" > "$arch.checksums.txt"
      - name: Verify Docker installers and persistent keys
        shell: bash
        run: |
          version='${{ github.ref_name }}'
          archive="docker-release/HomeWaf_Docker_Linux_${{ matrix.asset_arch }}_${version#v}.tar.gz"
          checksums='docker-release/${{ matrix.arch }}.checksums.txt'
          trap 'docker rm -f homewaf || true' EXIT
          bash install_homewaf.sh --docker --version "$version" --archive "$archive" --checksums "$checksums"
          before=$(docker exec homewaf sha256sum /app/.homewaf-keys/data_key)
          pwsh -NoProfile -File install_homewaf.ps1 -Docker -Directory /tmp/homewaf-unused -Version "$version" -ArchivePath "$archive" -ChecksumsPath "$checksums"
          after=$(docker exec homewaf sha256sum /app/.homewaf-keys/data_key)
          test "$before" = "$after"
          docker exec homewaf test -s /app/data/initial_password.txt
          docker exec homewaf /app/homewaf apikey init -o json > /dev/null
          key=$(docker exec homewaf cat /app/data/.keys/cli_api_key)
          docker exec homewaf wget -qO- --header "X-API-Key: $key" http://127.0.0.1:26666/api/v1/sysinfo/checkversion > container-version.json
          node -e 'const v=JSON.parse(require("fs").readFileSync("container-version.json")); if(v.code!==0 || !v.data.container || v.data.self_update_allowed!==false) throw new Error("Docker update notification policy failed");'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HomeWaf-container-${{ matrix.arch }}
          compression-level: 0
          path: docker-release/*
  publish:
    if: github.ref_type == 'tag'
    needs: [smoke, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: HomeWaf-container-*
          merge-multiple: true
          path: docker-release
      - name: Publish verified native and Docker packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version='${{ github.ref_name }}'
          cd docker-release
          cat *.checksums.txt > "HomeWaf_${version#v}_docker_checksums.txt"
          sha256sum --check "HomeWaf_${version#v}_docker_checksums.txt"
          gh release upload "$version" --repo '${{ github.repository }}' *.tar.gz "HomeWaf_${version#v}_docker_checksums.txt" --clobber
          gh release edit "$version" --repo '${{ github.repository }}' --draft=false --latest
  online-install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.0'
      - name: Verify public release downloads and online installation
        run: node scripts/verify-release.mjs dist ${{ github.ref_name }} --online
  public-container:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify one-command public Docker installation
        shell: bash
        run: |
          trap 'docker rm -f homewaf || true' EXIT
          curl -fsSL https://github.com/user1121114685/HomeWaf/releases/latest/download/install_homewaf.sh | bash -s -- --docker
          docker exec homewaf test -s /app/.homewaf-keys/data_key

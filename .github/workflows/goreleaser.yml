# HomeWaf modification (2026-11-09): independent distribution; see NOTICE and docs/modernization.

name: HomeWaf release packages
on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Produce reviewable archives without publishing
        if: github.ref_type != 'tag'
        run: go run github.com/goreleaser/goreleaser/v2@v2.20.0 release --snapshot --clean
      - name: Build a draft release for the tagged version
        if: github.ref_type == 'tag'
        run: go run github.com/goreleaser/goreleaser/v2@v2.20.0 release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HomeWaf-release-candidate
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*checksums.txt

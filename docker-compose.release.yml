services:
  homewaf:
    image: ghcr.io/user1121114685/homewaf:latest
    container_name: homewaf
    restart: unless-stopped
    ports:
      - "127.0.0.1:26666:26666"
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - homewaf-conf:/app/conf
      - homewaf-data:/app/data
      - homewaf-keys:/app/.homewaf-keys
      - homewaf-logs:/app/logs
      - homewaf-ssl:/app/ssl
volumes:
  homewaf-conf:
  homewaf-data:
  homewaf-keys:
  homewaf-logs:
  homewaf-ssl:

# HomeWaf modification (2026-11-09): independent distribution; see NOTICE and docs/modernization.

version: 2
project_name: HomeWaf
before:
  hooks:
    - go mod download
    - node scripts/build.mjs --web-only
builds:
  - id: homewaf_linux
    main: ./cmd/homewaf
    binary: HomeWafLinux64
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64]
    ldflags:
      - -s -w -X HomeWaf/global.GWAF_RELEASE=true -X HomeWaf/global.GWAF_RELEASE_VERSION=v{{.Version}} -X HomeWaf/global.GWAF_RELEASE_VERSION_NAME=HomeWaf
  - id: homewaf_linux_arm64
    main: ./cmd/homewaf
    binary: HomeWafLinuxArm64
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [arm64]
    ldflags:
      - -s -w -X HomeWaf/global.GWAF_RELEASE=true -X HomeWaf/global.GWAF_RELEASE_VERSION=v{{.Version}} -X HomeWaf/global.GWAF_RELEASE_VERSION_NAME=HomeWaf
  - id: homewaf_windows
    main: ./cmd/homewaf
    binary: HomeWaf64
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64]
    ldflags:
      - -s -w -X HomeWaf/global.GWAF_RELEASE=true -X HomeWaf/global.GWAF_RELEASE_VERSION=v{{.Version}} -X HomeWaf/global.GWAF_RELEASE_VERSION_NAME=HomeWaf
  - id: homewaf_macos
    main: ./cmd/homewaf
    binary: HomeWafDarwin64
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64]
    ldflags:
      - -s -w -X HomeWaf/global.GWAF_RELEASE=true -X HomeWaf/global.GWAF_RELEASE_VERSION=v{{.Version}} -X HomeWaf/global.GWAF_RELEASE_VERSION_NAME=HomeWaf
  - id: homewaf_macos_arm64
    main: ./cmd/homewaf
    binary: HomeWafDarwinArm64
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [arm64]
    ldflags:
      - -s -w -X HomeWaf/global.GWAF_RELEASE=true -X HomeWaf/global.GWAF_RELEASE_VERSION=v{{.Version}} -X HomeWaf/global.GWAF_RELEASE_VERSION_NAME=HomeWaf
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: 'HomeWaf_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}_{{ .Version }}'
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - LICENSES/THIRD_PARTY.txt
      - docs/modernization/MIGRATION.md
      - docs/modernization/SECURITY.md
      - docs/modernization/provenance.json
      - install_homewaf.sh
      - install_homewaf.ps1
      - README.md
checksum:
  name_template: 'HomeWaf_{{ .Version }}_checksums.txt'
release:
  github:
    owner: user1121114685
    name: HomeWaf
  draft: true
  replace_existing_draft: true
  target_commitish: '{{ .Commit }}'
  prerelease: auto
  header: 'HomeWaf {{ .Tag }}'
  extra_files:
    - glob: install_homewaf.sh
    - glob: install_homewaf.ps1

# HomeWaf modification (2026-11-09): independent distribution; see NOTICE and docs/modernization.

version: 2
project_name: HomeWaf
before:
  hooks:
    - go mod download
    - node scripts/build.mjs --web-only
builds:
  - id: homewaf_linux
    main: ./cmd/homewaf
    binary: HomeWafLinux64
    env: [CGO_ENABLED=1, CC=x86_64-linux-musl-gcc]
    goos: [linux]
    goarch: [amd64]
    ldflags:
      - -s -w -X HomeWaf/global.GWAF_RELEASE=true -X HomeWaf/global.GWAF_RELEASE_VERSION={{.Version}} -X HomeWaf/global.GWAF_RELEASE_VERSION_NAME=HomeWaf -extldflags '-static'
  - id: homewaf_linux_arm64
    main: ./cmd/homewaf
    binary: HomeWafLinuxArm64
    env: [CGO_ENABLED=1, CC=aarch64-linux-gnu-gcc]
    goos: [linux]
    goarch: [arm64]
    ldflags:
      - -s -w -X HomeWaf/global.GWAF_RELEASE=true -X HomeWaf/global.GWAF_RELEASE_VERSION={{.Version}} -X HomeWaf/global.GWAF_RELEASE_VERSION_NAME=HomeWaf -extldflags '-static'
  - id: homewaf_windows
    main: ./cmd/homewaf
    binary: HomeWaf64
    env: [CGO_ENABLED=1, CC=x86_64-w64-mingw32-gcc]
    goos: [windows]
    goarch: [amd64]
    ldflags:
      - -s -w -X HomeWaf/global.GWAF_RELEASE=true -X HomeWaf/global.GWAF_RELEASE_VERSION={{.Version}} -X HomeWaf/global.GWAF_RELEASE_VERSION_NAME=HomeWaf -extldflags '-static'
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: 'HomeWaf_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}_{{ .Version }}'
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - LICENSES/THIRD_PARTY.txt
      - docs/modernization/MIGRATION.md
      - docs/modernization/provenance.json
      - install_homewaf.sh
checksum:
  name_template: 'HomeWaf_{{ .Version }}_checksums.txt'
release:
  disable: true
  header: 'HomeWaf {{ .Tag }}'
